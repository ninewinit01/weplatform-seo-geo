<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>로그인 · {{ BRAND }} {{ APP_NAME }}</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/style.css?v=3"></head>
<body><div class="login-wrap"><div class="login">
  <div class="logo"><b>{{ BRAND }} {{ APP_NAME }}</b><span>광고주 사이트 SEO · GEO · 네이버 진단</span></div>
  <div class="card">
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form method="post" action="/login?next={{ next|urlencode }}">
      <label class="f">아이디<input name="username" autocomplete="username" required autofocus></label>
      <label class="f">비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">로그인</button>
    </form>
  </div>
  <p class="muted small" style="text-align:center">계정은 관리자에게 문의하세요.</p>
</div></div></body></html>
